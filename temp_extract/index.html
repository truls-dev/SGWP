<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapGen - Pro Snapchat Video Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
          font-family: 'Avenir Next LT Pro';
          src: url('https://cdn.jsdelivr.net/gh/light532/snapchat-templtates@main/AvenirNextLTPro-Regular.otf') format('opentype');
          font-weight: 400;
          font-style: normal;
        }

        @font-face {
          font-family: 'Avenir Black';
          src: url('https://raw.githubusercontent.com/truls-dev/fonts/main/AvenirLTProBlack.otf') format('opentype');
          font-weight: 900;
          font-style: normal;
        }

        body {
            font-family: 'Avenir Next LT Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Simulator Font Utilities */
        .snap-font-regular {
            font-family: 'Avenir Next LT Pro', sans-serif;
            font-weight: 400;
        }

        .snap-font-medium {
            font-family: 'Avenir Next LT Pro', sans-serif;
            font-weight: 500;
        }

        .snap-font-bold {
            font-family: 'Avenir Next LT Pro', sans-serif;
            font-weight: 700;
        }

        .snap-header-name {
            font-family: 'Avenir Black', sans-serif;
        }

        /* Protect Keyboard Font */
        .keyboard-font {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }

        /* Custom scrollbar for message list */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script>
      // Defensive check for process.env to prevent top-level crashes
      if (typeof window !== 'undefined' && typeof window.process === 'undefined') {
        window.process = { env: {} };
      }
    </script>
